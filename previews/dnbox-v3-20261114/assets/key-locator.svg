<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="title desc"><title id="title">Find the four step keys on the 37-key keyboard</title><desc id="desc">C3 is the first white key on the left. F3 is the fourth white key, C4 the eighth, G4 the twelfth and D5 the sixteenth. They control steps 1, 5, 9 and 13 in 909 SEQ. The black F sharp 3 key selects BD.</desc><rect width="920" height="300" rx="8" fill="#171d19"/><text x="20" y="32" fill="#f3f1e9" font-family="Arial" font-size="20">37 keys · C3–C6</text><text x="20" y="58" fill="#b8c0b9" font-family="Arial" font-size="14">Start at the left edge. Green keys place the four kicks in 909 SEQ.</text><rect x="20" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="39.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">C3</text><rect x="60" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="79.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">D3</text><rect x="100" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="119.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">E3</text><rect x="140" y="78" width="39" height="155" rx="2" fill="#d6f86d"/><text x="159.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">F3</text><text x="159.5" y="259" fill="#d6f86d" font-family="Arial" font-size="15" text-anchor="middle">1</text><rect x="180" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="199.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">G3</text><rect x="220" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="239.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">A3</text><rect x="260" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="279.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">B3</text><rect x="300" y="78" width="39" height="155" rx="2" fill="#d6f86d"/><text x="319.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">C4</text><text x="319.5" y="259" fill="#d6f86d" font-family="Arial" font-size="15" text-anchor="middle">5</text><rect x="340" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="359.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">D4</text><rect x="380" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="399.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">E4</text><rect x="420" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="439.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">F4</text><rect x="460" y="78" width="39" height="155" rx="2" fill="#d6f86d"/><text x="479.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">G4</text><text x="479.5" y="259" fill="#d6f86d" font-family="Arial" font-size="15" text-anchor="middle">9</text><rect x="500" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="519.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">A4</text><rect x="540" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="559.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">B4</text><rect x="580" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="599.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">C5</text><rect x="620" y="78" width="39" height="155" rx="2" fill="#d6f86d"/><text x="639.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">D5</text><text x="639.5" y="259" fill="#d6f86d" font-family="Arial" font-size="15" text-anchor="middle">13</text><rect x="660" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="679.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">E5</text><rect x="700" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="719.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">F5</text><rect x="740" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="759.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">G5</text><rect x="780" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="799.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">A5</text><rect x="820" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="839.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">B5</text><rect x="860" y="78" width="39" height="155" rx="2" fill="#e5e7dc"/><text x="879.5" y="218" fill="#101313" font-family="Arial" font-size="13" text-anchor="middle">C6</text><rect x="47" y="78" width="24" height="97" rx="2" fill="#101313" stroke="#4d5550"/><rect x="87" y="78" width="24" height="97" rx="2" fill="#101313" stroke="#4d5550"/><rect x="167" y="78" width="24" height="97" rx="2" fill="#101313" stroke="#ffad7b" stroke-width="3"/><text x="179" y="126" fill="#ffad7b" font-family="Arial" font-size="9" text-anchor="middle">BD</text><rect x="207" y="78" width="24" height="97" rx="2" fill="#101313" stroke="#4d5550"/><rect x="247" y="78" width="24" height="97" rx="2" fill="#101313" stroke="#4d5550"/><rect x="327" y="78" width="24" height="97" rx="2" fill="#101313" stroke="#4d5550"/><rect x="367" y="78" width="24" height="97" rx="2" fill="#101313" stroke="#4d5550"/><rect x="447" y="78" width="24" height="97" rx="2" fill="#101313" stroke="#4d5550"/><rect x="487" y="78" width="24" height="97" rx="2" fill="#101313" stroke="#4d5550"/><rect x="527" y="78" width="24" height="97" rx="2" fill="#101313" stroke="#4d5550"/><rect x="607" y="78" width="24" height="97" rx="2" fill="#101313" stroke="#4d5550"/><rect x="647" y="78" width="24" height="97" rx="2" fill="#101313" stroke="#4d5550"/><rect x="727" y="78" width="24" height="97" rx="2" fill="#101313" stroke="#4d5550"/><rect x="767" y="78" width="24" height="97" rx="2" fill="#101313" stroke="#4d5550"/><rect x="807" y="78" width="24" height="97" rx="2" fill="#101313" stroke="#4d5550"/><text x="20" y="285" fill="#b8c0b9" font-family="Arial" font-size="14">Numbers below the keys are step numbers. Orange marks F#3: select BD (kick).</text></svg>