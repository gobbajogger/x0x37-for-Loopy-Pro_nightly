<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 916 362" role="img" aria-labelledby="smk-title smk-desc"><title id="smk-title">SMK-37</title><desc id="smk-desc">Authored line drawing of an M-VAVE SMK-37, from M-VAVE’s official product photographs and the Panel Introduction diagram in the official Elite and Pro manuals. 37 velocity-sensitive keys, C to C, a three-octave range; pitch and modulation wheels at the upper left; a 1.54-inch display with a six-button cluster beneath it; eight rotary encoders in a single row above sixteen pads in two rows of eight; four faders at the upper right with twelve function buttons in two rows beneath them. Elite and Pro share this physical layout. This is a drawing, not a photograph and not a live device.</desc><rect x="6.00" y="6.00" width="904.00" height="350.00" rx="11" ry="11" fill="none" stroke="#E8E2D4" stroke-width="1.6"/>
